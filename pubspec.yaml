name: willopuslists
description: A simple task/shopping list Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^3.4.1
  cupertino_icons: ^1.0.8
  flutter_colorpicker: ^1.1.0
  http: ^1.5.0
  intl: 0.20.2  #current is ^0.20.3, not yet compatable with flutter_localizations.
  reorderables: ^0.6.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
      - assets/images/
      #- assets/languages/

